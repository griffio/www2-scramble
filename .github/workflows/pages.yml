name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; don't cancel a deployment that is already running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Smoke test: every module parses, and a short headless AI battle runs without throwing
      - name: Check
        run: |
          for f in js/*.js; do node --check "$f"; done
          node tools/battle.mjs normal 3 1

      # No build step: stage only the files the game serves (not tools/, docs/ or node_modules)
      - name: Stage site
        run: |
          mkdir _site
          cp -r index.html css js audio _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
